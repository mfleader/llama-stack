version: 2
distro_name: vertical-scaling-responses-agentic
apis:
- inference
- responses
- vector_io
- tool_runtime
- files
providers:
  inference:
  - provider_id: openai
    provider_type: remote::openai
    config:
      api_key: ${env.OPENAI_API_KEY:=fake-token}
      base_url: ${env.OPENAI_BASE_URL:=http://localhost:8080/v1}
  responses:
  - provider_id: builtin
    provider_type: inline::builtin
    config:
      persistence:
        agent_state:
          namespace: agents
          backend: kv_default
        responses:
          table_name: responses
          backend: sql_default
  vector_io:
  - provider_id: faiss
    provider_type: inline::faiss
    config:
      kvstore:
        namespace: vector_io::faiss
        backend: kv_default
      persistence:
        namespace: vector_io::faiss_persistence
        backend: kv_default
  tool_runtime:
  - provider_id: brave-search
    provider_type: remote::brave-search
    config:
      api_key: "fake-benchmark-key"
      max_results: 1
      base_url: ${env.MOCK_SEARCH_URL:=http://localhost:8080}
  files:
  - provider_id: builtin-files
    provider_type: inline::localfs
    config:
      storage_dir: /tmp/ogx-benchmark/files
      metadata_store:
        table_name: files_metadata
        backend: sql_default
storage:
  backends:
    kv_default:
      type: kv_sqlite
      db_path: /tmp/ogx-benchmark/kvstore.db
    sql_default:
      type: sql_sqlite
      db_path: /tmp/ogx-benchmark/sql_store.db
  stores:
    metadata:
      namespace: registry
      backend: kv_default
registered_resources:
  models:
  - model_id: mock-model
    provider_id: openai
    model_type: llm
server:
  port: 8321
